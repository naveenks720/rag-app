name: deploy

# On every merge to main: apply the app's Terraform (Lambda + URL), then sync docs/
# to the knowledge base bucket and re-run ingestion if any document changed.

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "src/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  ENVIRONMENT: dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Required reviewers on this environment give you a manual approval gate.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=rag-app/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: terraform plan
        working-directory: terraform
        run: terraform plan -input=false -no-color -var-file=envs/dev.tfvars -out=tfplan

      - name: terraform apply
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: sync docs and ingest
        run: |
          pip install --quiet boto3
          python scripts/ingest.py

      - name: print API URL
        working-directory: terraform
        run: terraform output api_url
